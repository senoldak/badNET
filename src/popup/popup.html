<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>badNET - Adaptive Video Quality</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-container">
    <!-- Header Surface -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
          </svg>
        </div>
        <div class="brand-text">
          <span class="title">badNET</span>
          <span class="subtitle">Adaptive Stream Engine</span>
        </div>
      </div>
      <label class="toggle-switch" title="Toggle Auto Optimization">
        <input type="checkbox" id="autoToggle" checked>
        <span class="toggle-track"></span>
      </label>
    </header>

    <!-- Quick Site Whitelist Toggle Bar -->
    <div class="site-exemption-bar">
      <span class="current-site-label" id="currentSiteLabel">Current Site: --</span>
      <button id="toggleExemptBtn" class="exempt-btn">Disable Here</button>
    </div>

    <!-- Realtime Speed & Canvas Graph Card -->
    <main class="dashboard">
      <section class="card speed-card">
        <div class="card-header">
          <span class="card-label">Live Bandwidth</span>
          <button id="retestBtn" class="retest-btn" title="Force Detailed Fast.com Speed Test">⚡ Test Speed</button>
        </div>
        
        <div class="graph-wrapper">
          <canvas id="speedGraph" width="268" height="55"></canvas>
        </div>

        <div class="speed-value-container">
          <span id="speedValue" class="speed-number">--</span>
          <div class="speed-unit-group">
            <span class="unit-text">Mbps</span>
          </div>
        </div>

        <!-- Telemetry Details Strip -->
        <div class="telemetry-strip">
          <div class="telemetry-item">
            <span class="telemetry-label">Ping Latency</span>
            <span class="telemetry-val" id="pingVal">-- ms</span>
          </div>
          <div class="telemetry-divider"></div>
          <div class="telemetry-item">
            <span class="telemetry-label">Peak Download</span>
            <span class="telemetry-val" id="rawSpeedVal">-- Mbps</span>
          </div>
        </div>
      </section>

      <!-- Key Metrics Row -->
      <section class="metrics-grid">
        <div class="metric-card">
          <div class="metric-icon data-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
          </div>
          <div class="metric-details">
            <span class="metric-label">Saved Quota</span>
            <span class="metric-value" id="savedDataValue">0 MB</span>
          </div>
        </div>

        <div class="metric-card">
          <div class="metric-icon audio-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 18V5l12-2v13"></path>
              <circle cx="6" cy="18" r="3"></circle>
              <circle cx="18" cy="16" r="3"></circle>
            </svg>
          </div>
          <div class="metric-details">
            <span class="metric-label">Audio Only</span>
            <label class="mini-toggle" title="Hide video display for max data saving">
              <input type="checkbox" id="audioToggle">
              <span class="mini-track"></span>
            </label>
          </div>
        </div>
      </section>

      <!-- Active Quality Badge -->
      <div class="status-banner" id="qualityBadge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="23 7 16 12 23 17 23 7"></polygon>
          <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
        </svg>
        <span class="badge-text">Auto (Evaluating...)</span>
      </div>

      <!-- Controls Form -->
      <section class="controls-card">
        <div class="control-row">
          <label for="maxCapSelect" class="control-label">Max Quality Ceiling (Default: 360p)</label>
          <div class="select-wrapper">
            <select id="maxCapSelect">
              <option value="360" selected>Max 360p (Default)</option>
              <option value="480">Max 480p</option>
              <option value="720">Max 720p (HD)</option>
              <option value="1080">Max 1080p (Full HD)</option>
              <option value="2160">No Limit (Up to 4K)</option>
            </select>
          </div>
        </div>

        <div class="control-row">
          <label for="sleepTimerSelect" class="control-label">Sleep Timer (Auto Pause)</label>
          <div class="select-wrapper">
            <select id="sleepTimerSelect">
              <option value="0">Off</option>
              <option value="15">15 Minutes</option>
              <option value="30">30 Minutes</option>
              <option value="60">1 Hour</option>
            </select>
          </div>
        </div>

        <div class="control-row">
          <label for="overrideSelect" class="control-label">Manual Quality Override</label>
          <div class="select-wrapper">
            <select id="overrideSelect" disabled>
              <option value="2160p">4K (2160p)</option>
              <option value="1440p">2K (1440p)</option>
              <option value="1080p">1080p (Full HD)</option>
              <option value="720p">720p (HD)</option>
              <option value="480p">480p</option>
              <option value="360p">360p</option>
            </select>
          </div>
        </div>
      </section>
    </main>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
